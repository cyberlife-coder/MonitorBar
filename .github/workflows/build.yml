name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package MonitorBar.app
        run: make app

      - name: Archive app bundle
        uses: actions/upload-artifact@v4
        with:
          name: MonitorBar-app
          path: MonitorBar.app
          retention-days: 14
